<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/vite-DcBtz0py.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BembeConnect</title>
    <!-- Manifest wird im Build automatisch injiziert.
         Für Dev ist es optional und kann weggelassen werden. -->
    <!-- <link rel="manifest" href="/manifest.webmanifest" /> -->
    <script type="module" crossorigin src="/assets/index-C_kzoCVS.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BDL2-5fV.css">
  <link rel="manifest" href="/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
    <!-- WICHTIG: Im Dev immer den Quell-Entry laden, NICHT /assets/... -->

    <!-- SPA fallback for GitHub Pages: fetch and render index.html so client-side routing works
         for direct navigations like /pkl/abrechnung (prevents 404). -->
    <script>
      (function () {
        try {
          var pathname = location.pathname;
          fetch('/index.html').then(function (r) {
            if (!r.ok) return null;
            return r.text();
          }).then(function (html) {
            if (!html) return;
            document.open();
            document.write(html);
            document.close();
            history.replaceState(null, '', pathname);
          }).catch(function () {
            /* ignore */
          });
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </body>
</html>
